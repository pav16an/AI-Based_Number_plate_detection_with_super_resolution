<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Detection - License Plate Detection System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            margin: 2rem auto;
            padding: 2rem;
        }
        .navbar {
            background: rgba(255, 255, 255, 0.95) !important;
            backdrop-filter: blur(10px);
        }
        .navbar-brand {
            font-weight: 700;
            color: #2c3e50 !important;
        }
        .nav-link {
            color: #7f8c8d !important;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        .nav-link:hover {
            color: #3498db !important;
        }
        .video-container {
            position: relative;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 1rem;
            max-width: 100%;
        }
        @media (min-width: 768px) {
            .video-container {
                margin-bottom: 2rem;
            }
        }
        #videoElement {
            width: 100%;
            height: auto;
            display: block;
        }
        #canvasElement {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .controls {
            text-align: center;
            margin-bottom: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
        }
        @media (min-width: 768px) {
            .controls {
                margin-bottom: 2rem;
            }
        }
        .btn-start {
            background: linear-gradient(45deg, #27ae60, #2ecc71);
            border: none;
            border-radius: 25px;
            padding: 12px 30px;
            font-weight: 600;
            color: white;
            transition: all 0.3s ease;
        }
        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(39, 174, 96, 0.3);
            color: white;
        }
        .btn-stop {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            border: none;
            border-radius: 25px;
            padding: 12px 30px;
            font-weight: 600;
            color: white;
            transition: all 0.3s ease;
        }
        .btn-stop:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(231, 76, 60, 0.3);
            color: white;
        }
        .btn-capture {
            background: linear-gradient(45deg, #3498db, #2980b9);
            border: none;
            border-radius: 25px;
            padding: 12px 30px;
            font-weight: 600;
            color: white;
            transition: all 0.3s ease;
        }
        .btn-capture:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(52, 152, 219, 0.3);
            color: white;
        }
        .btn-secondary {
            background: linear-gradient(45deg, #6c757d, #5a6268);
            border: none;
            border-radius: 25px;
            padding: 12px 30px;
            font-weight: 600;
            color: white;
            transition: all 0.3s ease;
        }
        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(108, 117, 125, 0.3);
            color: white;
        }
        .detection-panel {
            background: white;
            border-radius: 15px;
            padding: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-top: 1rem;
        }
        @media (min-width: 768px) {
            .detection-panel {
                padding: 1.5rem;
                margin-top: 0;
            }
        }
        .detected-plate {
            background: #e8f5e8;
            border: 2px solid #27ae60;
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        .plate-text {
            font-family: monospace;
            font-size: 1.5rem;
            font-weight: 700;
            color: #27ae60;
            margin-bottom: 0.5rem;
        }
        .plate-time {
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-active {
            background: #27ae60;
            animation: pulse 2s infinite;
        }
        .status-inactive {
            background: #e74c3c;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .stats-row {
            display: flex;
            justify-content: space-around;
            margin-bottom: 1rem;
        }
        .stat-item {
            text-align: center;
        }
        .stat-number {
            font-size: 1.5rem;
            font-weight: 700;
            color: #3498db;
        }
        .stat-label {
            color: #7f8c8d;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-car me-2"></i>License Plate Detection
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="fas fa-home me-1"></i>Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/webcam"><i class="fas fa-video me-1"></i>Live Detection</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/results"><i class="fas fa-chart-bar me-1"></i>Results</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container" style="margin-top: 80px; padding: 0 10px;">
        <div class="main-container">
            <!-- Header -->
            <div class="text-center mb-4">
                <h1 class="mb-3">
                    <i class="fas fa-video me-2" style="color: #3498db;"></i>
                    Live License Plate Detection
                </h1>
                <p class="text-muted">Real-time detection using your webcam</p>
            </div>

            <div class="row">
                <!-- Video Feed -->
                <div class="col-12 col-md-8">
                    <div class="video-container">
                        <video id="videoElement" autoplay muted playsinline></video>
                        <canvas id="canvasElement"></canvas>
                    </div>

                    <!-- Controls -->
                    <div class="controls">
                        <button id="startBtn" class="btn btn-start me-2">
                            <i class="fas fa-play me-2"></i>Start Camera
                        </button>
                        <button id="stopBtn" class="btn btn-stop me-2" disabled>
                            <i class="fas fa-stop me-2"></i>Stop Camera
                        </button>
                        <button id="captureBtn" class="btn btn-capture" disabled>
                            <i class="fas fa-camera me-2"></i>Capture Frame
                        </button>
                        <button id="flipBtn" class="btn btn-secondary" disabled>
                            <i class="fas fa-sync-alt me-2"></i>Flip Camera
                        </button>
                    </div>

                    <!-- Status -->
                    <div class="text-center">
                        <span class="status-indicator" id="statusIndicator"></span>
                        <span id="statusText">Camera Inactive</span>
                    </div>
                </div>

                <!-- Detection Panel -->
                <div class="col-12 col-md-4">
                    <div class="detection-panel">
                        <h5 class="mb-3">
                            <i class="fas fa-search me-2"></i>Detection Results
                        </h5>

                        <!-- Statistics -->
                        <div class="stats-row">
                            <div class="stat-item">
                                <div class="stat-number" id="totalDetections">0</div>
                                <div class="stat-label">Total</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number" id="sessionDetections">0</div>
                                <div class="stat-label">Session</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number" id="fps">0</div>
                                <div class="stat-label">FPS</div>
                            </div>
                        </div>

                        <hr>

                        <!-- Detected Plates -->
                        <div id="detectedPlates">
                            <p class="text-muted text-center">No plates detected yet</p>
                        </div>

                        <!-- Settings -->
                        <hr>
                        <h6><i class="fas fa-cog me-2"></i>Settings</h6>
                        <div class="mb-2">
                            <label for="confidenceSlider" class="form-label">Confidence: <span id="confidenceValue">0.5</span></label>
                            <input type="range" class="form-range" id="confidenceSlider" min="0.3" max="0.8" step="0.05" value="0.5">
                        </div>
                        <div class="mb-2">
                            <label for="intervalSlider" class="form-label">Detection Interval: <span id="intervalValue">800</span>ms</label>
                            <input type="range" class="form-range" id="intervalSlider" min="500" max="3000" step="200" value="800">
                        </div>
                        <div class="mb-2">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="continuousDetection" checked>
                                <label class="form-check-label" for="continuousDetection">
                                    Continuous Detection
                                </label>
                            </div>
                        </div>
                        <div class="mb-2">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="saveToDatabase">
                                <label class="form-check-label" for="saveToDatabase">
                                    Save to Database
                                </label>
                            </div>
                        </div>
                    </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ── DOM refs ──────────────────────────────────────────────────────────
        const videoElement    = document.getElementById('videoElement');
        const canvasElement   = document.getElementById('canvasElement');
        const ctx             = canvasElement.getContext('2d');
        const startBtn        = document.getElementById('startBtn');
        const stopBtn         = document.getElementById('stopBtn');
        const captureBtn      = document.getElementById('captureBtn');
        const flipBtn         = document.getElementById('flipBtn');
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText      = document.getElementById('statusText');
        const confidenceSlider = document.getElementById('confidenceSlider');
        const intervalSlider   = document.getElementById('intervalSlider');

        // ── State ─────────────────────────────────────────────────────────────
        let stream            = null;
        let detectionInterval = null;
        let fpsInterval       = null;
        let processingFrame   = false;
        let processingTimeout = null;
        let sessionDetections = 0;
        let detectedPlates    = new Set();
        let plateHistory      = new Map();
        let lastFrameTime     = Date.now();
        let frameCount        = 0;
        let currentFacingMode = 'environment';
        let rafId             = null;

        // ── Slider labels ─────────────────────────────────────────────────────
        confidenceSlider.addEventListener('input', e => {
            document.getElementById('confidenceValue').textContent = e.target.value;
        });
        intervalSlider.addEventListener('input', e => {
            document.getElementById('intervalValue').textContent = e.target.value;
            if (detectionInterval) { clearInterval(detectionInterval); startDetection(); }
        });
        document.getElementById('continuousDetection').addEventListener('change', e => {
            if (detectionInterval) clearInterval(detectionInterval);
            if (e.target.checked) startDetection();
        });

        // ── Canvas sync via RAF ───────────────────────────────────────────────
        // We size the canvas to match the VIDEO ELEMENT'S RENDERED (CSS) pixels.
        // This is the only correct way — no intrinsic-resolution math needed.
        function startCanvasSync() {
            function sync() {
                const rect = videoElement.getBoundingClientRect();
                if (rect.width > 0 && rect.height > 0) {
                    const w = Math.round(rect.width);
                    const h = Math.round(rect.height);
                    if (canvasElement.width !== w || canvasElement.height !== h) {
                        canvasElement.width  = w;
                        canvasElement.height = h;
                    }
                }
                rafId = requestAnimationFrame(sync);
            }
            rafId = requestAnimationFrame(sync);
        }
        function stopCanvasSync() {
            if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
        }

        // ── FPS counter ───────────────────────────────────────────────────────
        function startFPSCounter() {
            if (fpsInterval) clearInterval(fpsInterval);
            lastFrameTime = Date.now(); frameCount = 0;
            fpsInterval = setInterval(() => {
                const now = Date.now();
                document.getElementById('fps').textContent =
                    Math.round(frameCount * 1000 / (now - lastFrameTime));
                frameCount = 0; lastFrameTime = now;
            }, 1000);
        }

        // ── Start camera ──────────────────────────────────────────────────────
        startBtn.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: {ideal:1280}, height: {ideal:720},
                             facingMode: currentFacingMode, frameRate: {ideal:15} }
                });
                videoElement.srcObject = stream;
                startBtn.disabled = true; stopBtn.disabled = false;
                captureBtn.disabled = false; flipBtn.disabled = false;
                statusIndicator.className = 'status-indicator status-active';
                statusText.textContent = 'Camera Active';

                videoElement.addEventListener('playing', () => {
                    startCanvasSync();
                    startDetection();
                    startFPSCounter();
                }, { once: true });

            } catch (err) {
                console.error('Camera error:', err);
                alert('Error accessing camera: ' + err.message);
            }
        });

        // ── Stop camera ───────────────────────────────────────────────────────
        stopBtn.addEventListener('click', () => {
            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
            if (detectionInterval)  { clearInterval(detectionInterval);  detectionInterval  = null; }
            if (fpsInterval)        { clearInterval(fpsInterval);        fpsInterval        = null; }
            if (processingTimeout)  { clearTimeout(processingTimeout);   processingTimeout  = null; }
            stopCanvasSync();
            videoElement.srcObject = null;
            ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            processingFrame = false;
            startBtn.disabled = false; stopBtn.disabled = true;
            captureBtn.disabled = true; flipBtn.disabled = true;
            statusIndicator.className = 'status-indicator status-inactive';
            statusText.textContent = 'Camera Inactive';
        });

        captureBtn.addEventListener('click', () => captureAndProcess());

        flipBtn.addEventListener('click', async () => {
            if (!stream) return;
            stream.getTracks().forEach(t => t.stop());
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { width:{ideal:1280}, height:{ideal:720},
                             facingMode: currentFacingMode, frameRate:{ideal:15} }
                });
                videoElement.srcObject = stream;
            } catch (err) {
                alert('Could not switch camera: ' + err.message);
                currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            }
        });

        // ── Detection loop ────────────────────────────────────────────────────
        function startDetection() {
            if (!document.getElementById('continuousDetection').checked) return;
            if (detectionInterval) clearInterval(detectionInterval);
            captureAndProcess();
            const ms = parseInt(intervalSlider.value, 10);
            detectionInterval = setInterval(() => {
                if (!processingFrame) captureAndProcess();
            }, ms);
        }

        // ── Capture + send ────────────────────────────────────────────────────
        function captureAndProcess() {
            if (!videoElement.videoWidth || !videoElement.videoHeight) return;
            if (processingFrame) return;

            frameCount++;
            processingFrame = true;

            // Safety timeout – always release lock after 10 s
            if (processingTimeout) clearTimeout(processingTimeout);
            processingTimeout = setTimeout(() => { processingFrame = false; }, 10000);

            // Downscale to max 800 px wide for speed
            const srcW  = videoElement.videoWidth;
            const srcH  = videoElement.videoHeight;
            const ratio = Math.min(1, 800 / srcW);
            const sendW = Math.round(srcW * ratio);
            const sendH = Math.round(srcH * ratio);

            const tmp = document.createElement('canvas');
            tmp.width = sendW; tmp.height = sendH;
            tmp.getContext('2d').drawImage(videoElement, 0, 0, sendW, sendH);

            tmp.toBlob(blob => {
                if (blob) sendToBackend(blob, sendW, sendH);
                else { clearTimeout(processingTimeout); processingFrame = false; }
            }, 'image/jpeg', 0.85);
        }

        function sendToBackend(blob, sendW, sendH) {
            const fd = new FormData();
            fd.append('frame', blob);
            fd.append('confidence', confidenceSlider.value);
            fd.append('fast_mode', 'true');

            fetch('/process_frame', { method: 'POST', body: fd })
                .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                .then(data => {
                    clearTimeout(processingTimeout);
                    processingFrame = false;
                    if (data.success) {
                        drawDetections(data.detections || [], sendW, sendH);
                        if (data.license_plates && data.license_plates.length > 0)
                            updateDetectedPlates(data.license_plates);
                    } else {
                        ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                        console.warn('Backend:', data.error, data.details || '');
                    }
                })
                .catch(err => {
                    clearTimeout(processingTimeout);
                    processingFrame = false;
                    ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                    console.error('Frame error:', err);
                });
        }

        // ── Draw bounding boxes ───────────────────────────────────────────────
        // detections are in sendW x sendH coordinate space.
        // canvasElement.width/height equals the VIDEO ELEMENT's rendered CSS pixel size.
        // Scale factor maps detection coords → canvas coords.
        function drawDetections(detections, sendW, sendH) {
            ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            if (!detections.length) return;

            const cw = canvasElement.width;
            const ch = canvasElement.height;
            const sx = cw / sendW;
            const sy = ch / sendH;

            const COLORS = ['#00ff41', '#ff6b00', '#ff0066', '#00cfff', '#ffe600'];

            detections.forEach((det, i) => {
                const { x1, y1, x2, y2, label, confidence } = det;
                const color = COLORS[i % COLORS.length];
                const rx = x1 * sx, ry = y1 * sy;
                const rw = (x2 - x1) * sx, rh = (y2 - y1) * sy;

                // Box
                ctx.strokeStyle = color;
                ctx.lineWidth   = 3;
                ctx.strokeRect(rx, ry, rw, rh);

                // Corner accents
                const C = Math.min(16, rw * 0.3, rh * 0.3);
                ctx.lineWidth = 4;
                [[rx,    ry,    1,  1], [rx+rw, ry,    -1,  1],
                 [rx,    ry+rh, 1, -1], [rx+rw, ry+rh, -1, -1]].forEach(([cx2,cy2,dx,dy]) => {
                    ctx.beginPath();
                    ctx.moveTo(cx2 + dx*C, cy2);
                    ctx.lineTo(cx2,        cy2);
                    ctx.lineTo(cx2,        cy2 + dy*C);
                    ctx.stroke();
                });

                // Label badge
                const txt = label && label !== 'License Plate'
                    ? `${label}  ${(confidence*100).toFixed(0)}%`
                    : `Plate  ${(confidence*100).toFixed(0)}%`;
                ctx.font = 'bold 13px monospace';
                const tw = ctx.measureText(txt).width + 12;
                const th = 20;
                const ty = ry > th + 4 ? ry - th - 4 : ry + rh + 4;
                ctx.fillStyle = color;
                ctx.fillRect(rx, ty, tw, th);
                ctx.fillStyle = '#000';
                ctx.fillText(txt, rx + 6, ty + 14);
            });
        }

        // ── Plate history panel ───────────────────────────────────────────────
        function updateDetectedPlates(plates) {
            if (!plates || !plates.length) return;
            const panel = document.getElementById('detectedPlates');
            const now = Date.now();
            const BG  = ['#e8f5e8','#fff3e0','#e3f2fd','#fce4ec'];
            const BD  = ['#27ae60','#ff6b00','#2196f3','#e91e63'];

            plates.forEach(plate => {
                if (!plate) return;
                const last  = plateHistory.get(plate);
                if (last && (now - last) < 3000) return;
                plateHistory.set(plate, now);
                if (detectedPlates.has(plate)) return;
                detectedPlates.add(plate);
                sessionDetections++;

                const idx = (sessionDetections - 1) % 4;
                const div = document.createElement('div');
                div.className = 'detected-plate';
                div.style.backgroundColor = BG[idx];
                div.style.borderColor     = BD[idx];
                div.innerHTML = `
                    <div class="plate-text" style="color:${BD[idx]}">${plate}</div>
                    <div class="plate-time">${new Date().toLocaleTimeString()}</div>`;

                if (panel.querySelector('p')) panel.innerHTML = '';
                panel.insertBefore(div, panel.firstChild);
                const all = panel.querySelectorAll('.detected-plate');
                if (all.length > 5) all[all.length - 1].remove();
            });

            document.getElementById('sessionDetections').textContent = sessionDetections;
            updateTotalDetections();

            if (plateHistory.size > 100) {
                plateHistory = new Map([...plateHistory.entries()]
                    .sort((a,b) => b[1]-a[1]).slice(0,100));
            }
        }

        function updateTotalDetections() {
            fetch('/api/plates').then(r => r.json())
                .then(d => { if (!d.error) document.getElementById('totalDetections').textContent = d.length; })
                .catch(() => {});
        }

        document.addEventListener('DOMContentLoaded', () => updateTotalDetections());
    </script>
</body>
</html>
