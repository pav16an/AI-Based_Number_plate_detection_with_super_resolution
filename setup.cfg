[metadata]
name = license-plate-detection
version = 1.0.0
description = AI-based License Plate Detection with Super Resolution using YOLOv10 and EasyOCR
long_description = file: README.md
long_description_content_type = text/markdown
author = Your Organization
author_email = your-email@example.com
url = https://github.com/yourusername/license-plate-detection
project_urls =
    Bug Tracker = https://github.com/yourusername/license-plate-detection/issues
    Documentation = https://github.com/yourusername/license-plate-detection/wiki
license = MIT
classifiers =
    Development Status :: 5 - Production/Stable
    Environment :: Web Environment
    Framework :: Flask
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Topic :: Multimedia :: Graphics :: Graphics Conversion
    Topic :: Scientific/Engineering :: Artificial Intelligence

[options]
packages = find:
python_requires = >=3.9
include_package_data = True
install_requires =
    Flask>=2.3.0
    numpy>=1.24.0
    opencv-python-headless>=4.8.0
    torch>=2.0.0
    torchvision>=0.15.0
    ultralytics>=8.0.0
    easyocr>=1.7.0
    Pillow>=10.0.0

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    license-plate-detection = src.cli:main

[options.extras_require]
dev =
    pytest>=7.4.0
    pytest-cov>=4.1.0
    black>=23.0.0
    flake8>=6.0.0
    mypy>=1.0.0
    sphinx>=7.0.0
gpu =
    torch[cuda]>=2.0.0
    torchvision[cuda]>=0.15.0
