version: '3.8'

services:
  # Production application
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: license-plate-detection
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      DATABASE_PATH: /app/data/app.db
      MODEL_PATH: /app/weights/best.pt
      LOG_LEVEL: INFO
      WORKERS: 4
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./weights:/app/weights:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
